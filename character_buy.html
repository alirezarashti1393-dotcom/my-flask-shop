<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <title>اطلاعات کاراکتر</title>

    <link rel="stylesheet"
          href="/static/style.css">

    <link rel="icon"
          type="image/png"
          href="/static/logo.png">

</head>

<body>


<h1>
    🎭 اطلاعات کاراکتر
</h1>


<div class="container">


<div class="products">


<div class="box">


<h2>
    {{ character_type }}
</h2>


<form method="POST"
      action="/character_add">


    <h3>
        نام کاراکتر را درست وارد کنید
    </h3>


    <input
        type="text"
        name="character_name"
        placeholder="نام کاراکتر را وارد کنید"
        required
    >


    <input
        type="hidden"
        name="character_type"
        value="{{ character_type }}"
    >


    <input
        type="hidden"
        name="price"
        value="{{ price }}"
    >


    <br><br>


    <button
        class="buy"
        type="submit">

        🛒 افزودن به سبد خرید

    </button>


</form>


</div>


</div>


<div class="info">


<h2>
    ✅ تضمین رضایت شما
</h2>


<p>
    رضایت شما هدف اصلی سایت ماست.
</p>


<p>
    تمامی قیمت ها کمتر از قیمت های اصلی است.
</p>


<a class="back"
   href="/characters">

    بازگشت

</a>


</div>


</div>


</body>

</html>
