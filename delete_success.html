<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>حذف حساب</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="welcome">

    <h1>✅ حساب حذف شد</h1>

    <div class="user-management">

        <div class="user-management-box">

            <h2>
                حساب {{ username }}
                با موفقیت حذف شد.
            </h2>

        </div>

        <div class="user-management-box">

            <a
                href="/manage_user"
                class="user-management-button"
            >
                🔎 جستجوی کاربر دیگر
            </a>

            <a
                href="/profile"
                class="user-management-button"
            >
                ↩️ بازگشت به پنل سازنده
            </a>

        </div>

    </div>

</div>

</body>

</html>
