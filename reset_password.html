<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <title>بازنشانی رمز عبور</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="/static/logo.png"
    >

</head>

<body>

<div class="welcome">

    <h1>
        🔑 بازنشانی رمز عبور
    </h1>

    <h2>
        {{ user.get("username", "کاربر") }}
    </h2>

    <p>
        📱 {{ user.get("phone", "") }}
    </p>


    {% if error %}

        <div class="box">
            ❌ {{ error }}
        </div>

    {% endif %}


    {% if success %}

        <div class="box">
            ✅ {{ success }}
        </div>

    {% endif %}


    <form method="POST">

        <input
            type="password"
            name="new_password"
            placeholder="رمز عبور جدید را وارد کنید"
            required
        >

        <br><br>

        <button
            type="submit"
            class="buy"
        >
            🔑 تغییر رمز عبور
        </button>

    </form>


    <br>

    <a
        class="back"
        href="/users"
    >
        👥 بازگشت به کاربران
    </a>

</div>

</body>
</html>
