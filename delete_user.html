<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>حذف حساب</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .container {
        width: 90%;
        max-width: 600px;
    }

    h1 {
        font-size: 36px;
        margin-bottom: 25px;
    }

    .user-info {
        font-size: 22px;
        margin-bottom: 30px;
        line-height: 2;
    }

    .actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    .button {
        display: inline-flex;
        justify-content: center;
        align-items: center;

        min-width: 170px;
        padding: 14px 22px;

        border: 3px solid red;
        border-radius: 12px;

        color: red;
        background: transparent;

        text-decoration: none;

        font-size: 19px;
        font-weight: bold;

        cursor: pointer;
    }

    .button:hover {
        background: rgba(255, 0, 0, 0.08);
    }

    .back {
        margin-top: 25px;
    }
</style>
```

</head>

<body>

```
<div class="container">

    <h1>
        حذف حساب کاربر
    </h1>

    <div class="user-info">
        آیا مطمئن هستید که می‌خواهید حساب
        <strong>{{ user.get("username", "کاربر") }}</strong>
        را حذف کنید؟
    </div>

    <div class="actions">

        <!-- حذف فقط حساب -->
        <form
            method="POST"
            action="{{ url_for('delete_user', user_index=user_index) }}"
        >
            <button
                type="submit"
                class="button"
            >
                🗑️ حذف حساب
            </button>
        </form>

        <!-- حذف حساب و مسدود کردن شماره -->
        <form
            method="POST"
            action="{{ url_for('delete_user_and_phone', user_index=user_index) }}"
        >
            <button
                type="submit"
                class="button"
            >
                🚫 حذف حساب و شماره
            </button>
        </form>

    </div>

    <div class="back">

        <a
            href="/manage_user"
            class="button"
        >
            ↩️ بازگشت
        </a>

    </div>

</div>
```

</body>
</html>
