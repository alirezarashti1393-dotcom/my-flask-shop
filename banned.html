<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب مسدود شد</title>

```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Tahoma, Arial, sans-serif;
        background: linear-gradient(135deg, #111827, #1f2937);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .box {
        width: 100%;
        max-width: 600px;
        text-align: center;
        padding: 40px 25px;
        border: 3px solid red;
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.25);
    }

    h1 {
        color: red;
        font-size: 38px;
        margin-bottom: 25px;
    }

    .info {
        font-size: 20px;
        line-height: 2;
        margin-bottom: 25px;
    }

    .reason {
        color: #ff6b6b;
        font-weight: bold;
    }

    .back {
        display: inline-block;
        padding: 13px 30px;
        border: 2px solid red;
        border-radius: 10px;
        color: red;
        text-decoration: none;
        font-weight: bold;
        font-size: 18px;
    }

    .back:hover {
        background: rgba(255, 0, 0, 0.1);
    }
</style>
```

</head>

<body>

<div class="box">

```
<h1>حساب شما مسدود شده است</h1>

<div class="info">

    <p>
        کاربر:
        <strong>{{ user.get("username", "کاربر") }}</strong>
    </p>

    <p class="reason">
        دلیل بن:
        {{ reason }}
    </p>

    <p>
        بن شما تا:
        <strong>{{ ban_until.strftime("%Y/%m/%d %H:%M") }}</strong>
        ادامه دارد.
    </p>

</div>

<a href="/" class="back">
    ↩️ بازگشت به صفحه اصلی
</a>
```

</div>

</body>
</html>
